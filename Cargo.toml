[package]
name = "clide3d"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "A Maya-style 3D scene editor in Rust with a built-in MCP server, sculpting, rigging, and a GPU path tracer"
repository = "https://github.com/addamb/clide3d"
readme = "README.md"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.33.3"
egui-wgpu = "0.33.3"
flate2 = "1"
glam = { version = "0.30", features = ["serde", "bytemuck", "mint"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
meshopt = "0.6.2"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
transform-gizmo-egui = "0.8.0"
xatlas-rs-v2 = "0.1.4"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# 3MF print export (a zip of XML); entries are stored, so no compressor.
zip = { version = "8.6", default-features = false }
# EXR displacement maps and render passes (Q6), float data; no rayon.
exr = { version = "1.74", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
# Tablet pen pressure (Q4): an NSEvent local monitor, whose handler is a block.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "0.6.2"
